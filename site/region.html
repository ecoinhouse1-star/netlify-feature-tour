<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관심 지역 설정 · 우리동네 쿠폰마을</title>
<link rel="icon" href="/img/logo-96.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/app.css">
<style>
  .rg { display: grid; grid-template-columns: 110px 1fr; height: calc(100vh - 56px - 170px); }
  .rg .l { background: #f4f4f6; overflow-y: auto; }
  .rg .l button { display: block; width: 100%; height: 64px; font-size: 17px; color: #8a8a8e; }
  .rg .l button.on { background: #fff; color: var(--red); font-weight: 700; }
  .rg .l button small { display: block; font-size: 11px; color: #b5b5ba; font-weight: 400; }
  .rg .r { overflow-y: auto; padding: 4px 18px; }
  .rg .r button { display: flex; align-items: center; gap: 12px; width: 100%; height: 56px; font-size: 17px; color: #333; }
  .rg .r button .ck { width: 22px; visibility: hidden; }
  .rg .r button.on { color: var(--red); font-weight: 700; }
  .rg .r button.on .ck { visibility: visible; }
  .rg .r .ck svg { width: 22px; height: 22px; stroke: var(--red); fill: none; stroke-width: 3; }
  .rg .soon { color: var(--sub); padding: 30px 6px; line-height: 1.6; }
  .bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--maxw); background: #fff; border-top: 1px solid var(--line); padding: 16px 18px calc(16px + env(safe-area-inset-bottom)); }
  .bottom .top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 17px; }
  .bottom .top b { color: var(--red); }
  .bottom .reset { color: #8a8a8e; font-weight: 400; font-size: 16px; }
  .sel { display: flex; gap: 8px; overflow-x: auto; margin: 12px 0 14px; scrollbar-width: none; min-height: 42px; }
  .sel span { flex: 0 0 auto; background: #f4f4f6; border-radius: 10px; padding: 9px 14px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .sel span button { color: #6b6b70; font-size: 18px; line-height: 1; }
  .apply { width: 100%; height: 56px; border-radius: 14px; background: var(--red); color: #fff; font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
<div class="app no-tab" style="padding-bottom:0">
  <header class="topbar left" style="grid-template-columns:48px 1fr">
    <button class="icon-btn" id="back" aria-label="뒤로"></button>
    <h1 style="grid-column:2;padding-left:4px">관심 지역 설정</h1>
  </header>
  <div class="rg">
    <div class="l" id="left"></div>
    <div class="r" id="right"></div>
  </div>
</div>
<div class="bottom">
  <div class="top"><span>선택한 곳 <b id="n">0</b></span><button class="reset" id="reset">↻ 초기화</button></div>
  <div class="sel" id="sel"></div>
  <button class="apply" id="apply">적용하기</button>
</div>
<script type="module">
import { $, ICON, toast, esc } from "/js/common.js";
import { SIDO, myRegions, saveRegions } from "/js/regions.js";

$("#back").innerHTML = ICON.back;
$("#back").onclick = () => (history.length > 1 ? history.back() : (location.href = "/"));
const CK = '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>';

let sel = myRegions();
let cur = (sel[0] || "경기").split(" ")[0];
if (!SIDO.find((x) => x.key === cur)) cur = "경기";

function render() {
  $("#left").innerHTML = SIDO.map((s) => `<button class="${s.key === cur ? "on" : ""}" data-sido="${s.key}">${s.key}${s.open ? "" : "<small>준비 중</small>"}</button>`).join("");
  const s = SIDO.find((x) => x.key === cur);
  if (!s.open) {
    $("#right").innerHTML = `<div class="soon">🚧 <b>${esc(s.key)}</b> 지역은 준비 중이에요.<br>지금은 <b>경기도</b>부터 먼저 오픈했어요!</div>`;
  } else {
    const all = sel.includes(s.key);
    $("#right").innerHTML =
      `<button class="${all ? "on" : ""}" data-all="${s.key}"><span class="ck">${CK}</span>${s.key} 전체</button>` +
      s.list.map((g) => { const k = `${s.key} ${g}`; return `<button class="${sel.includes(k) ? "on" : ""}" data-sgg="${k}"><span class="ck">${CK}</span>${g}</button>`; }).join("");
  }
  $("#n").textContent = sel.length;
  $("#sel").innerHTML = sel.length
    ? sel.map((r) => `<span>${esc(r === "경기" ? "경기 전체" : r)}<button data-rm="${esc(r)}" aria-label="빼기">×</button></span>`).join("")
    : `<span>전국</span>`;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.sido) { cur = t.dataset.sido; }
  if (t.dataset.all) { sel = sel.includes(t.dataset.all) ? [] : [t.dataset.all]; }
  if (t.dataset.sgg) {
    sel = sel.filter((x) => x.includes(" "));
    sel = sel.includes(t.dataset.sgg) ? sel.filter((x) => x !== t.dataset.sgg) : [...sel, t.dataset.sgg];
    if (sel.length > 5) { sel.pop(); toast("최대 5곳까지 고를 수 있어요"); }
  }
  if (t.dataset.rm) { sel = sel.filter((x) => x !== t.dataset.rm); }
  if (t.dataset.sido || t.dataset.all || t.dataset.sgg || t.dataset.rm) render();
});
$("#reset").onclick = () => { sel = ["경기"]; cur = "경기"; render(); };
$("#apply").onclick = () => { saveRegions(sel); location.href = "/"; };
render();
</script>
</body>
</html>
