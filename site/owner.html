<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사장님 가게 관리 · 우리동네 쿠폰마을</title>
<link rel="icon" href="/img/logo-96.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/qrcode.js"></script>
</head>
<body>
<div class="app no-tab" style="padding-bottom:40px">
  <header class="topbar bordered has-two">
    <a class="icon-btn" href="/" id="home" aria-label="홈"></a>
    <h1 id="ttl">사장님 가게 관리</h1>
    <span></span><button class="icon-btn" id="out" style="font-size:12px;color:#8a8a8e;display:none;white-space:nowrap;width:auto">로그아웃</button>
  </header>
  <div id="root"><div class="empty">불러오는 중…</div></div>
</div>
<script type="module">
import { $, $$, api, esc, ICON, toast, config, copyText, fmtDate, fmtDateTime } from "/js/common.js";
import { SIDO } from "/js/regions.js";

$("#home").innerHTML = ICON.back;
const cfg = await config();
const GY = SIDO[0].list;
let me, tab = new URLSearchParams(location.search).get("tab") || "dash";

const dtLocal = (ms) => { if (!ms) return ""; const d = new Date(ms); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fromLocal = (v) => (v ? new Date(v).getTime() : null);
const v = (id) => $("#" + id)?.value?.trim() ?? "";

async function start() {
  try {
    me = await api("/api/owner/me");
    $("#out").style.display = "grid";
    render();
  } catch (e) {
    if (e.status === 401) return loginView();
    toast(e.message);
  }
}
$("#out").onclick = async () => { await api("/api/owner/logout", { method: "POST" }); location.reload(); };

// ---------- 로그인 / 가입 ----------
function loginView(mode = "login") {
  $("#ttl").textContent = mode === "login" ? "사장님 로그인" : "우리 가게 입점하기";
  $("#root").innerHTML = `<div style="text-align:center;padding-top:22px"><img src="/img/logo.png" alt="우리동네 쿠폰마을" width="110" height="110" style="margin:0 auto"></div>` + (mode === "login" ? `
    <div class="section">
      <div class="field"><label>가게 주소(아이디)</label><input class="input" id="slug" placeholder="예: hanuri" autocapitalize="off"></div>
      <div class="field"><label>비밀번호</label><input class="input" id="pw" type="password"></div>
      <div class="err" id="err"></div>
      <button class="btn red block" id="go">로그인</button>
      <button class="btn line block" id="toReg" style="margin-top:8px">처음이에요 · 가게 등록하기</button>
      <div class="notice" style="margin:16px 0 0">🧪 <b>체험 계정</b>: 가게 주소 <b>hanuri</b> / 비밀번호 <b>demo1234</b> (직원 확인 번호 0000)</div>
    </div>` : `
    <div class="section">
      <div class="place-box">
        <b>① 네이버 플레이스 링크만 붙여넣으세요</b>
        <div class="hint">네이버 지도 앱 → 우리 가게 → <b>공유</b> → <b>링크 복사</b> 후 붙여넣기. 가게 이름·주소·전화·업종·지도 위치가 자동으로 채워져요.</div>
        <textarea class="input" id="plink" rows="3" placeholder="https://naver.me/… 또는 공유 문구 전체" style="margin-top:10px"></textarea>
        <button class="btn red block" id="pload" style="margin-top:8px">가게 정보 불러오기</button>
        <div id="pres"></div>
      </div>
      ${cfg.joinCodeRequired ? `<div class="field"><label>가입 코드 (담당 영업사원에게 받으세요)</label><input class="input" id="jc"></div>` : ""}
      <h4 style="margin:22px 0 0">② 확인하고 비밀번호만 정하면 끝</h4>
      <div class="field"><label>가게 이름</label><input class="input" id="name" placeholder="예: 한우리 고깃집 행궁점"></div>
      <div class="field"><label>가게 주소(아이디) · 손님용 링크가 돼요</label><input class="input" id="slug" placeholder="영문 소문자·숫자 (예: hanuri)" autocapitalize="off">
        <div class="hint">링크: ${location.origin}/s/<b id="slugp">가게주소</b></div></div>
      <div class="field"><label>지역</label><div class="inline"><select class="input" id="sido"><option>경기</option></select><select class="input" id="sgg">${GY.map((g) => `<option>${g}</option>`).join("")}</select></div></div>
      <div class="field"><label>업종</label><div class="inline"><select class="input" id="cat">${cfg.categories.map((c) => `<option value="${c.key}">${c.emoji} ${c.name}</option>`).join("")}</select><select class="input" id="sub"></select></div></div>
      <div class="field"><label>가게 전화</label><input class="input" id="phone" inputmode="tel"></div>
      <div class="field"><label>도로명 주소</label><input class="input" id="addr" placeholder="경기 수원시 팔달구 …"></div>
      <div class="field"><label>지도 위치 (내 주변 검색에 쓰여요)</label><div class="hint" id="posv">플레이스 링크를 불러오면 자동으로 들어가요</div><button class="btn line sm" id="gps" style="margin-top:6px">📍 지금 위치를 가게 위치로</button></div>
      <div class="field"><label>비밀번호 (6자 이상)</label><input class="input" id="pw" type="password"></div>
      <div class="hint">등록하면 업종에 맞는 <b>첫 방문 쿠폰 · 7일 골든타임 쿠폰</b>이 자동으로 켜져서 바로 손님을 받을 수 있어요. (나중에 바꿀 수 있어요)</div>
      <div class="err" id="err"></div>
      <button class="btn red block" id="go">가게 등록하고 바로 시작</button>
      <button class="btn line block" id="toLogin" style="margin-top:8px">이미 등록했어요 · 로그인</button>
    </div>`);
  if (mode === "login") {
    $("#toReg").onclick = () => loginView("reg");
    $("#go").onclick = async () => {
      try { await api("/api/owner/login", { body: { slug: v("slug"), password: $("#pw").value } }); start(); }
      catch (e) { $("#err").textContent = e.message; }
    };
  } else {
    const place = {};
    const paintSub = (sel) => { const c = cfg.categories.find((x) => x.key === $("#cat").value); $("#sub").innerHTML = c.subs.map((x) => `<option ${x === sel ? "selected" : ""}>${x}</option>`).join(""); };
    $("#cat").onchange = () => paintSub();
    paintSub();
    $("#toLogin").onclick = () => loginView("login");
    $("#slug").oninput = () => ($("#slugp").textContent = v("slug") || "가게주소");
    $("#gps").onclick = () => navigator.geolocation?.getCurrentPosition((p) => { place.lat = p.coords.latitude; place.lng = p.coords.longitude; $("#posv").textContent = `설정됨 (${place.lat.toFixed(4)}, ${place.lng.toFixed(4)})`; }, () => toast("위치 권한을 허용해 주세요"));
    $("#pload").onclick = async () => {
      $("#pres").innerHTML = `<div class="hint" style="margin-top:8px">불러오는 중…</div>`;
      try {
        const r = await api("/api/place/lookup", { body: { input: $("#plink").value, name: v("name") } });
        const p = r.place;
        Object.assign(place, { lat: p.lat, lng: p.lng, placeId: p.placeId, placeUrl: p.placeUrl, reviewUrl: p.reviewUrl });
        if (p.name) $("#name").value = p.name;
        if (p.slug && !v("slug")) { $("#slug").value = p.slug; $("#slugp").textContent = p.slug; }
        if (p.sigungu && GY.includes(p.sigungu)) $("#sgg").value = p.sigungu;
        if (p.category) { $("#cat").value = p.category; paintSub(p.sub); }
        if (p.phone) $("#phone").value = p.phone;
        if (p.address) $("#addr").value = p.address;
        if (p.lat) $("#posv").textContent = `자동 설정됨 (${p.lat.toFixed(4)}, ${p.lng.toFixed(4)})`;
        $("#pres").innerHTML = `<div class="place-card">${p.name ? `✅ <b>${esc(p.name)}</b><br>` : ""}${esc(p.address || "")}${p.phone ? ` · ${esc(p.phone)}` : ""}${p.naverCategory ? `<br><small>${esc(p.naverCategory)}</small>` : ""}
          <div class="hint" style="margin-top:6px">추천 첫 방문 쿠폰: <b>${esc(r.offers.event)}</b></div></div>
          ${(p.notes || []).map((n) => `<div class="hint" style="color:#8a6400;margin-top:6px">⚠️ ${esc(n)}</div>`).join("")}`;
        if (p.needName) $("#name").focus(); else $("#pw").focus();
      } catch (e) { $("#pres").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
    $("#go").onclick = async () => {
      try {
        const r = await api("/api/owner/register", { body: { joinCode: v("jc"), name: v("name"), slug: v("slug"), sido: "경기", sigungu: v("sgg"), category: v("cat"), sub: v("sub"), phone: v("phone"), address: v("addr"), password: $("#pw").value, ...place } });
        tab = "dash";
        toast(`등록 완료! 손님용 링크: /s/${r.slug}`);
        start();
      } catch (e) { $("#err").textContent = e.message; }
    };
  }
}

// ---------- 메인 ----------
const TABS = [["dash", "📊 현황"], ["checkin", "➕ 매장 적립"], ["use", "✅ 쿠폰 사용처리"], ["cust", "👥 신규·단골 관리"], ["rules", "⚙️ 자동 발송"], ["report", "📈 월간 리포트"], ["ads", "🔗 광고 링크"], ["coupon", "🎟️ 쿠폰 설정"], ["info", "🏪 가게 정보"], ["msg", "💬 알림톡 기록"], ["promo", "📣 홍보물"]];
function render() {
  const s = me.store;
  $("#ttl").textContent = s.name;
  $("#root").innerHTML = `
    ${me.messaging === "test" ? `<div class="notice">⚠️ 알림톡이 아직 <b>테스트 모드</b>예요. 실제 발송은 안 되고 기록만 남아요. (솔라피 연동 후 자동 발송)</div>` : ""}
    <div class="owner-tabs">${TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</div>
    <div id="pane"></div>`;
  $$("[data-t]").forEach((b) => (b.onclick = () => { tab = b.dataset.t; history.replaceState(null, "", "?tab=" + tab); render(); }));
  ({ dash, checkin, use, coupon, info, cust, rules, report, ads, msg, promo })[tab]();
}

async function dash() {
  const { stats: st, queue } = await api("/api/owner/stats");
  const max = Math.max(1, ...st.daily.map((d) => Math.max(d.issued, d.used)));
  $("#pane").innerHTML = `
    <div style="padding:14px 18px 0"><button class="btn red block" id="goCheckin">➕ 손님 방문 적립하기 (전화번호)</button></div>
    <div class="kpis">
      <div class="kpi"><small>모은 손님</small><b>${st.customers}명</b><em>이번 주 +${st.newThisWeek}</em></div>
      <div class="kpi"><small>단골 (2회 이상)</small><b>${st.regulars}명</b></div>
      <div class="kpi"><small>이벤트 쿠폰 사용률</small><b>${st.event.rate}%</b><em>${st.event.used}/${st.event.issued}장</em></div>
      <div class="kpi"><small>7일 재방문율 (골든타임)</small><b>${st.golden.rate}%</b><em>${st.golden.used}/${st.golden.issued}장</em></div>
      <div class="kpi"><small>이웃가게에서 보내준 손님</small><b>${st.cross.used}명</b><em>받은 쿠폰 ${st.cross.issued}장</em></div>
      <div class="kpi"><small>발송 대기 알림톡</small><b>${queue}건</b></div>
    </div>
    <div class="panel"><h4>최근 14일</h4>
      <div class="bars">${st.daily.map((d) => `<div><i class="a" style="height:${(d.issued / max) * 100}%"></i><i class="b" style="height:${(d.used / max) * 100}%"></i><span>${d.label.split("/")[1]}</span></div>`).join("")}</div>
      <div class="legend"><span><i style="background:#f6b4b8"></i>발급</span><span><i style="background:var(--red)"></i>사용(방문)</span></div>
      <h4>손님용 링크</h4>
      <div class="inline"><input class="input" readonly value="${esc(me.link)}"><button class="btn" id="cp">복사</button></div>
      <div class="hint">동네 포털 화면 링크예요. 광고에는 <b>🔗 광고 링크</b> 탭의 경로별 링크를 쓰면 어느 광고가 효과 있는지 보여요.</div>
      <div class="notice" style="margin:14px 0 0">🔑 직원 확인 번호: <b style="font-size:18px">${esc(me.store.staffPin)}</b> — 손님 쿠폰 화면에서 직원이 입력해요. (가게 정보 탭에서 변경)</div>
    </div>`;
  $("#cp").onclick = () => copyText(me.link);
  $("#goCheckin").onclick = () => { tab = "checkin"; render(); };
}

function use() {
  $("#pane").innerHTML = `<div class="panel">
    <h4>쿠폰 번호로 사용 처리</h4>
    <div class="hint">손님 휴대폰 쿠폰 화면의 번호(영문·숫자 10자리)를 입력하세요.</div>
    <div class="inline" style="margin-top:10px"><input class="input" id="code" autocapitalize="characters" placeholder="예: ABCD23EFGH"><button class="btn red" id="go">사용</button></div>
    <div id="res"></div>
    <h4>최근 발급된 쿠폰</h4><div id="recent">불러오는 중…</div></div>`;
  $("#go").onclick = async () => {
    const code = v("code").toLowerCase();
    try {
      const r = await api(`/api/coupons/${encodeURIComponent(code)}/redeem`, { body: {} });
      $("#res").innerHTML = `<div class="reward" style="margin:12px 0">✅ <b>${esc(r.coupon.benefit)}</b> 사용 처리 완료${r.golden ? `<br>⏰ 7일 골든타임 쿠폰 자동 발급` : ""}${r.cross ? `<br>🤝 이웃가게 쿠폰(${esc(r.cross.partner.name)}) 자동 발급` : ""}</div>`;
      $("#code").value = "";
      use_recent();
    } catch (e) { $("#res").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  use_recent();
}
async function use_recent() {
  const { coupons } = await api("/api/owner/coupons");
  const K = { event: "이벤트", golden: "골든타임", cross: "이웃가게", hidden: "히든", secret: "시크릿" };
  $("#recent").innerHTML = coupons.length ? `<table class="tbl"><tr><th>번호</th><th>종류·혜택</th><th>상태</th></tr>${coupons.slice(0, 40).map((c) => `<tr><td style="font-family:monospace">${c.id.toUpperCase()}</td><td><span class="pill">${K[c.kind] || c.kind}</span> ${esc(c.benefit)}<br><small class="hint">${fmtDateTime(c.issuedAt)} 발급</small></td><td><span class="pill ${c.status === "used" ? "ok" : c.status === "expired" ? "bad" : "warn"}">${{ active: "대기", used: "사용", expired: "만료" }[c.status]}</span></td></tr>`).join("")}</table>` : `<div class="hint">아직 없어요</div>`;
}

function coupon() {
  const s = me.store, e = s.event || {}, g = s.golden || {};
  $("#pane").innerHTML = `<div class="panel">
    <h4>① 이벤트 쿠폰 (랜딩페이지 '쿠폰 받기')</h4>
    <div class="field"><label>이벤트 이름</label><input class="input" id="et" value="${esc(e.title)}" placeholder="예: 7주년 감사 이벤트"></div>
    <div class="field"><label>쿠폰 혜택</label><input class="input" id="eb" value="${esc(e.benefit)}" placeholder="예: 전 메뉴 30% 할인 (최대 9,000원)"></div>
    <div class="field"><label>이벤트 기간</label><div class="inline"><input class="input" type="datetime-local" id="es" value="${dtLocal(e.startAt)}"><input class="input" type="datetime-local" id="ee" value="${dtLocal(e.endAt)}"></div></div>
    <div class="field"><div class="inline"><div style="flex:1"><label>쿠폰 사용 기한(일)</label><input class="input" id="ed" type="number" min="1" value="${e.couponDays || 14}"></div><div style="flex:1"><label>선착순 수량 (비우면 무제한)</label><input class="input" id="el" type="number" min="1" value="${e.limit || ""}"></div></div></div>
    <div class="hint">만료 이틀 전 오전 11시에 "쿠폰 만료가 이틀 남았습니다!" 알림이 자동 발송돼요.</div>
    <h4>카드에 보일 큰 글씨</h4>
    <div class="field"><div class="inline"><input class="input" id="hl" value="${esc(s.headline)}" placeholder="예: 30% 할인"><input class="input" id="hs" value="${esc(s.headlineSub)}" placeholder="예: 최대 9,000원"></div></div>
    <div class="field"><label>보조 설명</label><input class="input" id="nt" value="${esc(s.note)}" placeholder="예: 이용금액 30,000원까지 30% 적용"></div>

    <h4>② 7일 골든타임 재방문 쿠폰</h4>
    <label class="check" style="margin-top:0"><input type="checkbox" id="ge" ${g.enabled ? "checked" : ""}><span>쿠폰 사용(방문) 직후 자동 발급 · 1~2시간 뒤 알림톡 · 만료 하루 전 리마인드</span></label>
    <div class="radio-cards" style="margin-top:10px">${Object.entries(cfg.goldenTypes).map(([k, t]) => `<label><input type="radio" name="gt" value="${k}" ${g.type === k ? "checked" : ""}><b>${t.name}</b><div class="hint">예) ${t.example}</div></label>`).join("")}</div>
    <div class="field"><label>골든타임 혜택</label><input class="input" id="gb" value="${esc(g.benefit)}" placeholder="예: 2인 이상 재방문 시 시그니처 사이드 무료"></div>
    <div class="field"><label>선착순 수량 (미션형 추천, 비우면 무제한)</label><input class="input" id="gl" type="number" min="1" value="${g.limit || ""}"></div>

    <h4>③ 동네 크로스 쿠폰 (이웃가게 품앗이)</h4>
    <div class="field"><label>이웃 가게 손님에게 우리 가게가 줄 혜택</label><input class="input" id="cx" value="${esc(s.crossOffer)}" placeholder="예: 아메리카노 1+1"><div class="hint">근처 가게에서 쿠폰을 쓴 손님에게 자동으로 우리 가게 쿠폰이 가요. 비우면 참여 안 함.</div></div>

    <h4>④ 30일 미방문 시크릿 혜택</h4>
    <div class="field"><input class="input" id="ch" value="${esc(s.churnOffer)}" placeholder="예: 방문 시 음료 1잔 서비스"></div>

    <h4>⑤ 단골 등급 히든 메뉴</h4>
    <div class="field"><label>🏡 단골 이웃 (2회 이상)</label><input class="input" id="hr" value="${esc(s.hidden?.regular)}"></div>
    <div class="field"><label>👑 동네 VIP (5회 이상)</label><input class="input" id="hv" value="${esc(s.hidden?.vip)}"></div>

    <h4>⑥ 리뷰 유도</h4>
    <div class="field"><label>네이버 플레이스 리뷰 링크</label><input class="input" id="nv" value="${esc(s.naverPlaceUrl)}" placeholder="https://m.place.naver.com/…/review"></div>
    <div class="field"><label>리뷰 보상</label><input class="input" id="rr" value="${esc(s.reviewReward)}"></div>
    <div class="field"><label>리뷰 키워드 (쉼표로 구분)</label><input class="input" id="kw" value="${esc((s.keywords || []).join(", "))}"></div>

    <button class="btn red block" id="save" style="margin-top:20px">저장하기</button></div>`;

function shrink(file, max = 1200) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => rej(new Error("사진을 읽을 수 없어요"));
    img.src = URL.createObjectURL(file);
  });
}

function sendSheet(ids, suggest) {
  const presets = {
    "방문 유도 쿠폰": "첫 방문 시 음료 1잔 서비스",
    "7일 안 재방문 쿠폰": "7일 안에 다시 오시면 사이드 메뉴 무료",
    "단골 감사 히든 혜택": "단골 감사: 메인 메뉴 10% 할인",
    "보고 싶어요 쿠폰": me.store.churnOffer || "방문 시 음료 1잔 서비스",
  };
  const bg = document.createElement("div");
  bg.className = "sheet-bg show";
  const sh = document.createElement("div");
  sh.className = "sheet";
  sh.innerHTML = `<h3>${ids.length}명에게 쿠폰 보내기</h3>
    <div class="hint">알림 수신에 동의한 손님에게만 알림톡으로 가요. 같은 손님에게는 7일에 한 번만 보낼 수 있어요.</div>
    <div class="chips" style="flex-wrap:wrap;margin-top:12px">${Object.keys(presets).map((k) => `<button class="chip ${k === suggest ? "on" : ""}" data-p="${k}">${k}</button>`).join("")}</div>
    <div class="field"><label>쿠폰 이름</label><input class="input" id="st" value="${esc(suggest || "사장님이 보낸 특별 쿠폰")}"></div>
    <div class="field"><label>혜택</label><input class="input" id="sb" value="${esc(presets[suggest] || "")}"></div>
    <div class="field"><label>사용 기한(일)</label><input class="input" id="sd" type="number" value="14" min="1" max="60"></div>
    <div class="err" id="serr"></div>
    <button class="btn red block" id="sok">보내기</button>
    <button class="btn line block" id="sx" style="margin-top:8px">취소</button>`;
  document.body.append(bg, sh);
  requestAnimationFrame(() => sh.classList.add("show"));
  const close = () => { sh.classList.remove("show"); bg.style.display = "none"; setTimeout(() => { sh.outerHTML = ""; bg.outerHTML = ""; }, 250); };
  bg.onclick = close;
  $("#sx", sh).onclick = close;
  $$("[data-p]", sh).forEach((b) => (b.onclick = () => {
    $$("[data-p]", sh).forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    $("#st", sh).value = b.dataset.p;
    $("#sb", sh).value = presets[b.dataset.p];
  }));
  $("#sok", sh).onclick = async () => {
    try {
      const r = await api("/api/owner/send-coupons", { body: { customerIds: ids, title: $("#st", sh).value, benefit: $("#sb", sh).value, days: $("#sd", sh).value } });
      close();

      toast(`${r.sent}명에게 보냈어요${r.skipped ? ` (제외: ${why})` : ""}`);
      cust();
    } catch (e) { $("#serr", sh).textContent = e.message; }
  };
}

function summaryLine(c, p, R) {
  const parts = [];
  if (c.newCustomers) parts.push(`새 손님 ${c.newCustomers}명이 왔어요${p.newCustomers ? ` (지난달보다 ${c.newCustomers >= p.newCustomers ? "+" : ""}${c.newCustomers - p.newCustomers}명)` : ""}.`);
  if (c.visitors) parts.push(`방문 손님 ${c.visitors}명 중 ${c.revisitRate}%가 다시 온 손님이에요.`);
  if (R.segments.risk) parts.push(`이탈 위험 손님 ${R.segments.risk}명에게 '보고 싶어요 쿠폰'을 보내보세요.`);
  if (!parts.length) parts.push("아직 데이터가 적어요. 매장 QR과 손님용 링크를 홍보해 보세요!");
  return parts.join(" ");
}

function qrDownload(link, label) {
  const q = qrcode(0, "M"); q.addData(link); q.make();
  const n = q.getModuleCount(), size = 900, pad = 60, cell = (size - pad * 2) / n;
  const c = document.createElement("canvas"); c.width = size; c.height = size + 150;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#111";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect(pad + k * cell, pad + r * cell, Math.ceil(cell), Math.ceil(cell));
  g.fillStyle = "#e2232e"; g.fillRect(0, size, c.width, 150);
  g.fillStyle = "#fff"; g.textAlign = "center"; g.font = '800 54px Pretendard, "Malgun Gothic", sans-serif';
  g.fillText(`${me.store.name} 쿠폰 받기`, size / 2, size + 70);
  g.font = '500 34px Pretendard, "Malgun Gothic", sans-serif'; g.fillText(`QR 찍고 바로 받기 · ${label}`, size / 2, size + 120);
  const a = document.createElement("a"); a.download = `${me.store.slug}-${label}-qr.png`; a.href = c.toDataURL("image/png");
  document.body.appendChild(a); a.click(); a.outerHTML = "";
}

    ${queue.length ? `<table class="tbl"><tr><th>보낼 시각</th><th>종류</th></tr>${queue.sort((a, b) => a.due - b.due).slice(0, 30).map((j) => `<tr><td>${fmtDateTime(j.due)}</td><td>${QN[j.type] || j.type}</td></tr>`).join("")}</table>` : `<div class="hint">없어요</div>`}
    <h4>보낸 메시지</h4>
    ${messages.length ? messages.map((m) => `<div class="msg"><div class="h"><span><span class="pill ${m.ok ? (m.mode === "test" ? "warn" : "ok") : "bad"}">${m.ok ? (m.mode === "test" ? "테스트(미발송)" : m.mode === "alimtalk" ? "알림톡" : "문자") : "실패"}</span> ${esc(m.typeName)}</span><span>${fmtDateTime(m.at)} · ${esc(m.to)}</span></div><pre>${esc(m.text)}</pre>${m.error ? `<div class="err">${esc(m.error)}</div>` : ""}</div>`).join("") : `<div class="hint">아직 없어요</div>`}</div>`;
}

function promo() {
  $("#pane").innerHTML = `<div class="panel">
    <h4>📣 원클릭 홍보물 만들기</h4>
    <div class="hint">음식 사진 3장과 할인 문구만 넣으면 릴스용 영상과 매장용 QR 포스터를 만들어 드려요.</div>
    <a class="btn red block" style="display:grid;place-items:center;margin-top:14px" href="/owner/poster">홍보물 만들기 시작</a>
    <h4>손님용 링크 · QR</h4>
    <div class="inline"><input class="input" readonly value="${esc(me.link)}"><button class="btn" id="cp">복사</button></div></div>`;
  $("#cp").onclick = () => copyText(me.link);
}

start();
</script>
</body>
</html>
