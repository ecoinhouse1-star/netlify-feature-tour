<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/img/logo-96.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/app.css">
<title>카테고리 · 우리동네 쿠폰마을</title>
</head>
<body>
<div class="app">
  <header class="topbar left has-two"><h1 style="grid-column:1/3">카테고리</h1><a class="icon-btn" href="/?search=1" id="s" aria-label="검색"></a></header>
  <div class="seg"><button class="on">매장</button><button onclick="location.href='/region.html'">지역</button></div>
  <div class="catpage"><div class="side" id="side"></div><div class="list" id="list"></div></div>
</div>
<script type="module">
import { $, $$, config, tabbar, ICON } from "/js/common.js";
tabbar("cat");
$("#s").innerHTML = ICON.search;
const cfg = await config();
const arrow = ICON.right;
$("#side").innerHTML = `<a class="cat on" href="/" data-k=""><div class="tile" style="font-size:20px;font-weight:900;color:#9a9aa0">ALL</div><span>전체</span></a>` +
  cfg.categories.map((c) => `<a class="cat" href="#c-${c.key}" data-k="${c.key}"><div class="tile">${c.emoji}</div><span>${c.name}</span></a>`).join("");
$("#list").innerHTML = `<div class="cat-group"><a class="cat-row" href="/"><b style="font-size:20px"><span style="color:#9a9aa0;font-weight:900">ALL</span> 전체</b>${arrow}</a></div>` +
  cfg.categories.map((c) => `<div class="cat-group" id="c-${c.key}"><div class="cat-h"><span class="e">${c.emoji}</span>${c.name}</div>
    <a class="cat-row" href="/?cat=${c.key}">전체${arrow}</a>
    ${c.subs.map((s) => `<a class="cat-row" href="/?cat=${c.key}&sub=${encodeURIComponent(s)}">${s}${arrow}</a>`).join("")}</div>`).join("");
$$("#side .cat").forEach((a) => a.addEventListener("click", () => { $$("#side .cat").forEach((x) => x.classList.remove("on")); a.classList.add("on"); }));
</script>
</body>
</html>
